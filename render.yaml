# Render blueprint for the 1Thing executive core.
#
# Deploy: push this repo to GitHub, then Render -> New -> Blueprint.
# The database is managed; the app runs the Dockerfile at the repo root.
services:
  - type: web
    name: onething-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: onething-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: RUN_SCHEDULER
        value: "1"
      - key: DEMO_PHONE
        value: "+15550007777"
      - key: MODEL_API_KEY
        sync: false
      - key: META_API_BASE_URL
        value: "https://api.meta.ai/v1"
      - key: META_VOICE_MODEL
        value: "muse-wonder-1.0"
      - key: META_VISION_MODEL
        value: "muse-wonder-1.0"
      - key: BASETEN_API_KEY
        sync: false
      - key: BASETEN_BASE_URL
        value: "https://inference.baseten.co/v1"
      - key: BASETEN_MODEL
        value: "meta-models/muse-spark-open-1026"
      - key: MODAL_WORKER_URL
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

databases:
  - name: onething-db
    plan: basic-256mb
    postgresMajorVersion: "16"
